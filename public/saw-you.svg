<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="url(#grad)" />
  
  <!-- Eye outline (almond shape) -->
  <path d="M15 50 Q50 20 85 50 Q50 80 15 50 Z" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Eye white -->
  <ellipse cx="50" cy="50" rx="18" ry="18" fill="white"/>
  
  <!-- Iris -->
  <circle cx="50" cy="50" r="12" fill="#1e1b4b"/>
  
  <!-- Pupil -->
  <circle cx="50" cy="50" r="6" fill="#0f172a"/>
  
  <!-- Eye shine -->
  <circle cx="54" cy="46" r="4" fill="white" opacity="0.9"/>
  <circle cx="46" cy="52" r="2" fill="white" opacity="0.5"/>
  
  <!-- Location pin dot (subtle) at bottom of iris -->
  <circle cx="50" cy="58" r="2" fill="#f472b6"/>
</svg>
